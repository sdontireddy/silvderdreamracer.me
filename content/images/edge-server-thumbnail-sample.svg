<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img" aria-labelledby="title desc">
  <title id="title">Edge Server Thumbnail Sample</title>
  <desc id="desc">A blog thumbnail showing warehouse devices connecting to an edge server and then to cloud warehouse management.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f4efe4"/>
      <stop offset="55%" stop-color="#dceef2"/>
      <stop offset="100%" stop-color="#b8d7df"/>
    </linearGradient>
    <linearGradient id="panel" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#12343b"/>
      <stop offset="100%" stop-color="#1f5864"/>
    </linearGradient>
    <linearGradient id="cloud" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#fff8ef"/>
      <stop offset="100%" stop-color="#ffe3b3"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#0f172a" flood-opacity="0.18"/>
    </filter>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#ef6c3e"/>
    </marker>
    <style>
      .headline { font: 700 58px Georgia, 'Times New Roman', serif; fill: #102127; }
      .sub { font: 500 23px 'Segoe UI', Tahoma, sans-serif; fill: #28434a; }
      .label { font: 700 22px 'Segoe UI', Tahoma, sans-serif; fill: #ffffff; }
      .small { font: 600 18px 'Segoe UI', Tahoma, sans-serif; fill: #d9f2f6; }
      .tiny { font: 600 16px 'Segoe UI', Tahoma, sans-serif; fill: #28434a; }
      .cloudtext { font: 700 24px 'Segoe UI', Tahoma, sans-serif; fill: #6c4b00; }
      .wire { fill: none; stroke: #ef6c3e; stroke-width: 6; stroke-linecap: round; stroke-linejoin: round; }
    </style>
  </defs>

  <rect width="1200" height="630" fill="url(#bg)"/>
  <circle cx="1030" cy="90" r="78" fill="#fff7d8" opacity="0.95"/>
  <path d="M0 468 C180 410 280 522 430 482 C612 434 734 532 900 484 C1012 452 1090 468 1200 436 L1200 630 L0 630 Z" fill="#8fb8a8" opacity="0.45"/>
  <path d="M0 505 C150 465 306 560 458 518 C618 475 782 568 938 520 C1046 488 1128 512 1200 488 L1200 630 L0 630 Z" fill="#6b9488" opacity="0.50"/>

  <rect x="58" y="58" width="1084" height="514" rx="30" fill="#ffffff" opacity="0.52"/>

  <text x="82" y="122" class="headline">Why Edge Servers Matter</text>
  <text x="84" y="160" class="sub">Connecting warehouse devices to cloud WMS securely, locally, and fast.</text>

  <g filter="url(#shadow)">
    <rect x="390" y="220" width="400" height="230" rx="26" fill="url(#panel)"/>
    <rect x="432" y="260" width="316" height="112" rx="14" fill="#0f252b" stroke="#7cd4e4" stroke-width="2"/>
    <circle cx="458" cy="392" r="10" fill="#7cd4e4"/>
    <circle cx="493" cy="392" r="10" fill="#efc14a"/>
    <circle cx="528" cy="392" r="10" fill="#ef6c3e"/>
    <rect x="565" y="388" width="150" height="9" rx="4" fill="#4fb9c7" opacity="0.9"/>
    <text x="495" y="205" class="label">EDGE SERVER</text>
    <text x="474" y="430" class="small">Protocol translation  Security  Routing</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="840" y="248" width="240" height="140" rx="70" fill="url(#cloud)"/>
    <circle cx="902" cy="248" r="48" fill="url(#cloud)"/>
    <circle cx="1002" cy="230" r="58" fill="url(#cloud)"/>
    <circle cx="1056" cy="272" r="42" fill="url(#cloud)"/>
    <text x="890" y="315" class="cloudtext">Cloud WMS</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="108" y="266" width="138" height="108" rx="18" fill="#f7fcfc" stroke="#2c7e8c" stroke-width="3"/>
    <rect x="130" y="286" width="92" height="54" rx="8" fill="#dff4f7" stroke="#2c7e8c" stroke-width="3"/>
    <rect x="144" y="349" width="64" height="10" rx="5" fill="#2c7e8c"/>
    <text x="126" y="397" class="tiny">RF Device</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="110" y="404" width="138" height="96" rx="16" fill="#fffaf2" stroke="#b9771f" stroke-width="3"/>
    <rect x="132" y="422" width="94" height="40" rx="6" fill="#ffe8c2" stroke="#b9771f" stroke-width="3"/>
    <path d="M132 471 H226" stroke="#b9771f" stroke-width="5"/>
    <path d="M150 484 H208" stroke="#b9771f" stroke-width="4" stroke-dasharray="6 5"/>
    <text x="132" y="526" class="tiny">Label Printer</text>
  </g>

  <g filter="url(#shadow)">
    <rect x="930" y="432" width="196" height="84" rx="18" fill="#f6fbff" stroke="#4370a6" stroke-width="3"/>
    <circle cx="972" cy="474" r="18" fill="#bdd7f5" stroke="#4370a6" stroke-width="3"/>
    <circle cx="1048" cy="474" r="18" fill="#bdd7f5" stroke="#4370a6" stroke-width="3"/>
    <rect x="983" y="454" width="54" height="16" rx="6" fill="#bdd7f5" stroke="#4370a6" stroke-width="3"/>
    <text x="962" y="532" class="tiny">ERP / OMS / APIs</text>
  </g>

  <path d="M248 320 C292 320 325 320 382 320" class="wire" marker-end="url(#arrow)"/>
  <path d="M248 452 C302 442 330 418 382 372" class="wire" marker-end="url(#arrow)"/>
  <path d="M794 320 C836 320 860 320 918 320" class="wire" marker-end="url(#arrow)"/>
  <path d="M790 382 C854 414 882 430 930 456" class="wire" marker-end="url(#arrow)"/>

  <text x="268" y="302" class="tiny">Local facility traffic</text>
  <text x="806" y="300" class="tiny">Secure cloud path</text>
  <text x="804" y="414" class="tiny">Business integrations</text>

  <rect x="82" y="540" width="362" height="18" rx="9" fill="#ef6c3e" opacity="0.88"/>
  <text x="84" y="527" class="sub">Sample blog thumbnail for Edge Service / Edge Server content</text>
</svg>
