<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
    aria-labelledby="title desc">
    <title id="title">Edge Servers in WMS</title>
    <desc id="desc">Warehouse and edge node illustration</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#1a1f36" />
            <stop offset="100%" stop-color="#243b55" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)" />
    <rect x="120" y="250" width="360" height="240" rx="14" fill="#2f4f6f" />
    <rect x="170" y="300" width="120" height="80" rx="8" fill="#7fc8f8" />
    <rect x="310" y="300" width="120" height="80" rx="8" fill="#7fc8f8" />
    <rect x="170" y="395" width="260" height="55" rx="8" fill="#5fa8d3" />
    <rect x="650" y="170" width="390" height="300" rx="18" fill="#314f7a" />
    <rect x="700" y="230" width="290" height="60" rx="10" fill="#89d6fb" />
    <rect x="700" y="315" width="290" height="60" rx="10" fill="#89d6fb" />
    <g stroke="#d9f6ff" stroke-width="4" fill="none" opacity="0.8">
        <path d="M480 360 L650 320" />
        <path d="M480 390 L650 350" />
    </g>
    <text x="80" y="110" fill="#f0f8ff" font-size="56" font-family="Segoe UI, Arial, sans-serif"
        font-weight="700">Why Edge Servers Matter</text>
    <text x="80" y="165" fill="#cfe8ff" font-size="30" font-family="Segoe UI, Arial, sans-serif">Resilience
        and low latency for warehouse execution</text>
</svg>