<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img"
    aria-labelledby="title desc">
    <title id="title">Edge Service vs XBound in MAWM</title>
    <desc id="desc">Diagram showing facility devices connecting through Edge Service to Manhattan
        cloud and Manhattan cloud calling external systems through XBound.</desc>

    <defs>
        <style>
      .title { font: 700 34px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .subtitle { font: 500 18px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
      .h { font: 700 22px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .p { font: 500 15px 'Segoe UI', Tahoma, sans-serif; fill: #0f172a; }
      .small { font: 500 14px 'Segoe UI', Tahoma, sans-serif; fill: #334155; }
      .card { rx: 16; ry: 16; }
      .arrowline { stroke: #1d4ed8; stroke-width: 3; stroke-linecap: round; }
    </style>
        <marker id="arrow" markerWidth="8" markerHeight="8" viewBox="0 0 10 10" refX="9" refY="5"
            orient="auto" markerUnits="strokeWidth">
            <polygon points="0,0 10,5 0,10" fill="#1d4ed8" />
        </marker>
    </defs>

    <rect x="0" y="0" width="1200" height="650" fill="#f8fafc" />
    <rect x="22" y="22" width="1156" height="606" fill="#ffffff" stroke="#e2e8f0" />

    <text x="60" y="78" class="title">Edge Service vs XBound in MAWM</text>
    <text x="60" y="110" class="subtitle">Edge handles facility-side device connectivity. XBound
        handles outbound API integrations.</text>

    <rect x="60" y="150" width="500" height="430" class="card" fill="#ecfeff" stroke="#0891b2"
        stroke-width="2" />
    <text x="90" y="195" class="h">Edge Service Path</text>
    <text x="90" y="220" class="small">Facility devices to Manhattan cloud</text>

    <rect x="90" y="250" width="190" height="80" class="card" fill="#ffffff" stroke="#06b6d4" />
    <text x="108" y="280" class="p">Printers / RF / MHE</text>
    <text x="108" y="302" class="small">Private facility network</text>

    <rect x="320" y="250" width="200" height="80" class="card" fill="#ffffff" stroke="#06b6d4" />
    <text x="362" y="280" class="p">Edge Service</text>
    <text x="355" y="302" class="small">Protocol + security</text>

    <rect x="320" y="390" width="200" height="80" class="card" fill="#ffffff" stroke="#06b6d4" />
    <text x="350" y="420" class="p">Manhattan Cloud</text>
    <text x="356" y="442" class="small">WMS components</text>

    <line x1="280" y1="290" x2="316" y2="290" class="arrowline" marker-end="url(#arrow)" />
    <line x1="420" y1="330" x2="420" y2="386" class="arrowline" marker-end="url(#arrow)" />
    <text x="300" y="275" class="small">local protocols</text>
    <text x="435" y="365" class="small">HTTPS</text>

    <rect x="640" y="150" width="500" height="430" class="card" fill="#eff6ff" stroke="#2563eb"
        stroke-width="2" />
    <text x="670" y="195" class="h">XBound Path</text>
    <text x="670" y="220" class="small">Manhattan cloud to external systems</text>

    <rect x="670" y="250" width="190" height="80" class="card" fill="#ffffff" stroke="#60a5fa" />
    <text x="702" y="280" class="p">Manhattan Cloud</text>
    <text x="708" y="302" class="small">WMS components</text>

    <rect x="900" y="250" width="200" height="80" class="card" fill="#ffffff" stroke="#60a5fa" />
    <text x="965" y="280" class="p">XBound</text>
    <text x="943" y="302" class="small">Outbound router/proxy</text>

    <rect x="900" y="390" width="200" height="80" class="card" fill="#ffffff" stroke="#60a5fa" />
    <text x="930" y="420" class="p">ERP / OMS / TMS</text>
    <text x="940" y="442" class="small">External APIs</text>

    <line x1="860" y1="290" x2="896" y2="290" class="arrowline" marker-end="url(#arrow)" />
    <line x1="1000" y1="330" x2="1000" y2="386" class="arrowline" marker-end="url(#arrow)" />
    <text x="872" y="275" class="small">service definition</text>
    <text x="1012" y="365" class="small">HTTPS/API</text>

    <rect x="60" y="600" width="1080" height="26" fill="#ffffff" />
    <text x="60" y="620" class="small">Design principle: Use Edge for facility device communication
        and XBound for outbound enterprise integrations.</text>
</svg>