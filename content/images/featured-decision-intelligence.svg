<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630" role="img"
    aria-labelledby="title desc">
    <title id="title">Decision Intelligence</title>
    <desc id="desc">Abstract supply chain data flow visual</desc>
    <defs>
        <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="#0f2027" />
            <stop offset="55%" stop-color="#203a43" />
            <stop offset="100%" stop-color="#2c5364" />
        </linearGradient>
    </defs>
    <rect width="1200" height="630" fill="url(#bg)" />
    <g opacity="0.35" fill="none" stroke="#8de0ff" stroke-width="3">
        <path d="M120 500 C260 350, 420 360, 560 250" />
        <path d="M120 560 C290 420, 500 420, 760 220" />
        <path d="M220 570 C450 460, 700 410, 980 180" />
    </g>
    <g fill="#b9f2ff">
        <circle cx="220" cy="500" r="12" />
        <circle cx="430" cy="365" r="12" />
        <circle cx="560" cy="250" r="12" />
        <circle cx="760" cy="220" r="12" />
        <circle cx="980" cy="180" r="12" />
    </g>
    <text x="80" y="110" fill="#ecfbff" font-size="56" font-family="Segoe UI, Arial, sans-serif"
        font-weight="700">Transaction to Decision</text>
    <text x="80" y="165" fill="#c9f5ff" font-size="30" font-family="Segoe UI, Arial, sans-serif">Supply-chain
        intelligence at operational speed</text>
</svg>